
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행운의 로또 번호 뽑기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fff8e7, #e8f5ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 850px;
    background: white;
    border-radius: 30px;
    padding: 45px 25px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}

h1 {
    font-size: 38px;
    color: #263b5e;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 21px;
    color: #666;
    margin-bottom: 40px;
}

.balls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 30px 0 40px;
    min-height: 100px;
}

.ball {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 34px;
    font-weight: bold;
    color: #222;
    box-shadow:
        inset -5px -7px 12px rgba(0,0,0,0.15),
        inset 4px 5px 10px rgba(255,255,255,0.7),
        0 5px 10px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

.ball.pop {
    animation: pop 0.35s ease;
}

@keyframes pop {
    0% { transform: scale(0.5); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

.ball.placeholder {
    background: #eeeeee;
    color: #aaaaaa;
}

.yellow { background: #ffd54f; }
.blue { background: #64b5f6; }
.red { background: #ef7777; color: white; }
.gray { background: #bdbdbd; }
.green { background: #81c784; }
.purple { background: #ba91df; color: white; }

button {
    width: 100%;
    max-width: 360px;
    padding: 22px 25px;
    border: none;
    border-radius: 18px;
    font-size: 27px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px auto;
    display: block;
    transition: 0.2s;
}

#drawBtn {
    background: #ff9f1c;
    color: white;
    box-shadow: 0 6px 0 #d77c08;
}

#drawBtn:hover {
    background: #f18c00;
}

#resetBtn {
    background: #e9eef5;
    color: #33445c;
}

button:active {
    transform: translateY(3px);
    box-shadow: none !important;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    font-size: 20px;
    color: #555;
    margin-top: 25px;
    min-height: 30px;
    font-weight: bold;
}

.footer {
    font-size: 16px;
    color: #999;
    margin-top: 30px;
}

@media (max-width: 550px) {
    h1 { font-size: 29px; }
    .ball {
        width: 65px;
        height: 65px;
        font-size: 26px;
    }
    .balls { gap: 10px; }
    button { font-size: 23px; }
    .container { padding: 35px 15px; }
}
</style>
</head>

<body>

<div class="container">

    <h1>🍀 행운의 로또 번호 🍀</h1>

    <div class="subtitle">
        오늘의 행운 번호 6개를 뽑아보세요!
    </div>

    <div class="balls" id="balls">
        <div class="ball placeholder">?</div>
        <div class="ball placeholder">?</div>
        <div class="ball placeholder">?</div>
        <div class="ball placeholder">?</div>
        <div class="ball placeholder">?</div>
        <div class="ball placeholder">?</div>
    </div>

    <button id="drawBtn" onclick="drawNumbers()">
        🎯 번호 뽑기
    </button>

    <button id="resetBtn" onclick="resetNumbers()">
        🔄 다시 뽑기
    </button>

    <div class="message" id="message">
        버튼을 누르면 행운의 번호가 나옵니다!
    </div>

    <div class="footer">
        ※ 로또 번호는 무작위로 추첨됩니다.
    </div>

</div>

<script>
const colors = [
    "yellow",
    "blue",
    "red",
    "gray",
    "green",
    "purple"
];

let isDrawing = false;

function randomNumber() {
    const array = new Uint32Array(1);
    const max = 4294967296;
    const limit = max - (max % 45);

    do {
        crypto.getRandomValues(array);
    } while (array[0] >= limit);

    return (array[0] % 45) + 1;
}

function createNumbers() {
    const numbers = [];

    while (numbers.length < 6) {
        const num = randomNumber();

        if (!numbers.includes(num)) {
            numbers.push(num);
        }
    }

    return numbers.sort((a, b) => a - b);
}

function drawNumbers() {
    if (isDrawing) return;

    isDrawing = true;

    const drawBtn = document.getElementById("drawBtn");
    const message = document.getElementById("message");
    const balls = document.getElementById("balls");

    drawBtn.disabled = true;
    drawBtn.textContent = "🍀 번호 추첨 중...";

    message.textContent = "두근두근! 행운의 번호를 뽑고 있습니다.";

    const finalNumbers = createNumbers();
    const ballElements = [];

    balls.innerHTML = "";

    for (let i = 0; i < 6; i++) {
        const ball = document.createElement("div");
        ball.className = "ball " + colors[i];
        ball.textContent = "?";

        balls.appendChild(ball);
        ballElements.push(ball);
    }

    let completed = 0;

    function animateBall(index) {
        let count = 0;
        const totalChanges = 12 + index * 4;

        const timer = setInterval(() => {
            ballElements[index].textContent = randomNumber();
            count++;

            if (count >= totalChanges) {
                clearInterval(timer);

                ballElements[index].textContent = finalNumbers[index];
                ballElements[index].classList.add("pop");

                completed++;

                if (completed === 6) {
                    isDrawing = false;
                    drawBtn.disabled = false;
                    drawBtn.textContent = "🎯 다시 번호 뽑기";
                    message.textContent =
                        "🎉 축하합니다! 오늘의 행운 번호입니다!";
                }
            }

        }, 70);

    }

    for (let i = 0; i < 6; i++) {
        setTimeout(() => {
            animateBall(i);
        }, i * 250);
    }
}

function resetNumbers() {
    if (isDrawing) return;

    const balls = document.getElementById("balls");
    const message = document.getElementById("message");
    const drawBtn = document.getElementById("drawBtn");

    balls.innerHTML = "";

    for (let i = 0; i < 6; i++) {
        const ball = document.createElement("div");
        ball.className = "ball placeholder";
        ball.textContent = "?";
        balls.appendChild(ball);
    }

    drawBtn.textContent = "🎯 번호 뽑기";
    message.textContent = "버튼을 누르면 행운의 번호가 나옵니다!";
}
</script>

</body>
</html>
